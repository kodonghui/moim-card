                summary: 공유 링크로 진입
                value:
                  referrerKind: external_share
              other:
                summary: 그 밖의 진입
                value:
                  referrerKind: other
      responses:
        '204':
          description: 기록됨. 본문 없음
        '400':
          description: referrerKind가 틀림
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                bad-kind:
                  summary: 알 수 없는 값
                  value:
                    type: about:blank
                    title: 칸 옆의 안내를 확인해 주세요
                    status: 400
                    code: validation_failed
                    traceId: 4c93757f93623f95
                    errors:
                    - field: referrerKind
                      reason: invalid_choice
                not-json:
                  $ref: '#/components/examples/not-json'
        '401':
          description: 세션 토큰이 없거나 끝남(C-1). 아무것도 읽거나 쓰지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no-session:
                  $ref: '#/components/examples/no-session'
                session-expired:
                  $ref: '#/components/examples/session-expired'
        '403':
          description: 이 호출자는 할 수 없음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                origin-not-allowed:
                  $ref: '#/components/examples/origin-not-allowed'
        '429':
          description: 요청 한도를 넘음. 아무것도 바뀌지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                write-limit:
                  $ref: '#/components/examples/write-limit'
          headers:
            Retry-After:
              description: 다시 보내도 되는 때까지 남은 초
              schema:
                type: integer
                minimum: 1
                maximum: 86400
              example: 30
        default:
          description: 그 밖의 오류(500 internal, 라우터의 404 route_not_found·405 method_not_allowed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                server-error:
                  $ref: '#/components/examples/server-error'
                method-not-allowed:
                  $ref: '#/components/examples/method-not-allowed'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API-001의 sessionToken. 수명 12시간, D1에는 SHA-256 해시만(TBL-002)
  parameters:
    RoomCode:
      name: roomCode
      in: path
      required: true
      description: 방 코드. 형식이 틀려도 400이 아니라 없는 방과 같은 404예요(C-5, DEC-021). 그래서 여기에는 형식을 걸지 않아요. 바른 형식은 RoomCodeValue예요
      schema:
        type: string
        minLength: 1
        maxLength: 64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 화면이 만든 요청 ID(UUID, TBL-013). 같은 사용자·같은 키면 24시간 동안 첫 결과를 다시 돌려줘요
      schema:
        type: string
        minLength: 36
        maxLength: 36
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  examples:
    missing-idempotency-key:
      summary: Idempotency-Key 헤더가 없음
      value:
        type: about:blank
        title: 요청을 처리하지 못했어요. 다시 해 주세요
        status: 400
        code: invalid_request
        traceId: 4084630a111fb6b9
    not-json:
      summary: 본문이 JSON이 아님
      value:
        type: about:blank
        title: 요청을 처리하지 못했어요. 다시 해 주세요
        status: 400
        code: invalid_request
        traceId: 117c39df22afd21b
    no-session:
      summary: 세션 토큰이 없음
      value:
        type: about:blank
        title: 다시 확인이 필요해요
        status: 401
        code: unauthenticated
        traceId: f7abe906176f8b21
    session-expired:
      summary: 세션 토큰이 12시간이 지나 끝남
      value:
        type: about:blank
        title: 다시 확인이 필요해요
        status: 401
        code: unauthenticated
        traceId: 0ab529841374011e
    origin-not-allowed:
      summary: 허용되지 않은 Origin
      value:
        type: about:blank
        title: 지금은 쓸 수 없어요
        status: 403
        code: origin_not_allowed
        traceId: 376df97e73f7bea5
    room-not-found:
      summary: 없는 방 코드
      value:
        type: about:blank
        title: 이 방은 없거나 보관 기간이 지났어요
        status: 404
        code: room_not_found
        traceId: 7ae57054ce8d7b6b
    room-code-wrong-format:
      summary: 형식이 틀린 방 코드도 같은 응답(C-5)
      value:
        type: about:blank
        title: 이 방은 없거나 보관 기간이 지났어요
        status: 404
        code: room_not_found
        traceId: 3bd964a27169a1e9
    room-expired:
      summary: 만료로 지워진 방
      value:
        type: about:blank
        title: 이 방은 없거나 보관 기간이 지났어요
        status: 404
        code: room_not_found
        traceId: dcfe83e8756c8359
    write-limit:
      summary: 쓰기 요청 사용자당 분당 60건 초과(C-6)
      value:
        type: about:blank
        title: 잠시 뒤 다시 해 주세요
        status: 429
        code: rate_limited
        traceId: 5b1fcecb526fb390
    server-error:
      summary: 예상하지 못한 서버 오류
      value:
        type: about:blank
        title: 잠시 뒤 다시 해 주세요
        status: 500
        code: internal
        traceId: 009e299cf8a41c91
    method-not-allowed:
      summary: 그 경로에 없는 메서드(Allow 헤더 유지)
      value:
        type: about:blank
        title: 요청을 처리하지 못했어요
        status: 405
        code: method_not_allowed
        traceId: cf986a3800138cb4
    not-participant:
      summary: 참여자가 아닌 사용자
      value:
        type: about:blank
        title: 이 방에 먼저 들어와 주세요
        status: 403
        code: not_participant
        traceId: f068dcc156dcabec
    response-required:
      summary: 열린 방에서 응답 전
      value:
        type: about:blank
        title: 답하면 볼 수 있어요
        status: 403
        code: response_required
        traceId: 0a99a1bf1fec68f8
    room-closed:
      summary: 방이 그사이 마감됨
      value:
        type: about:blank
        title: 방이 그사이 마감됐어요
        status: 409
        code: room_closed
        traceId: ac259da15d7c78b1
    idempotency-conflict:
      summary: 같은 요청 ID를 다른 본문으로 보냄
      value:
        type: about:blank
        title: 요청을 처리하지 못했어요. 다시 해 주세요
        status: 409
        code: idempotency_conflict
        traceId: 095f68814896e396
  schemas:
    Problem:
      type: object
      description: 모든 오류 응답의 모양(RFC 9457 Problem Details + code, traceId, errors)
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
          description: 지금은 늘 about:blank
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: 사용자에게 보여 줄 문구(errors 목록의 message)
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: 응답의 HTTP 상태와 늘 같음
        detail:
          type: string
          maxLength: 200
          description: 개발용 설명. 입력 값·스택·SQL·토스 응답 원문을 넣지 않음(C-2)
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
          - invalid_request
          - validation_failed
          - auth_code_invalid
          - unauthenticated
          - auth_failed
          - origin_not_allowed
          - not_participant
          - response_required
          - not_host
          - identity_mismatch
          - room_not_found
          - route_not_found
          - method_not_allowed
          - room_closed
          - room_full
          - already_submitted
          - not_enough_responses
          - theme_unavailable
          - idempotency_conflict
          - rate_limited
          - internal
          - toss_unavailable
        traceId:
          type: string
          pattern: ^[0-9a-f]{16}$
          description: 서버 로그에 남긴 요청 ID
        errors:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/FieldError'
      additionalProperties: false
    FieldError:
      type: object
      required:
      - field
      - reason
      description: 칸별 이유. 보낸 값은 넣지 않아요
      properties:
        field:
          type: string
          enum:
          - authCode
          - themeId
          - gatheringName
          - partySize
          - hostNickname
          - nickname
          - answers
          - cursor
          - referrerKind
        reason:
          type: string
          enum:
          - required
          - too_long
          - out_of_range
          - not_integer
          - banned_word
          - control_character
          - wrong_count
          - unknown_question
          - invalid_choice
          - invalid_format
        positions:
          type: array
          description: answers의 문제 문항 번호(남은 문항 포함)
          maxItems: 8
          items:
            type: integer
            minimum: 1
            maximum: 8
      additionalProperties: false
    RoomCodeValue:
      type: string
      pattern: ^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{10}$
      description: rooms.code(TBL-006). 0·O·1·I·L을 뺀 31자에서 10자
    ThemeRef:
      type: object
      required:
      - themeId
      - name
      additionalProperties: false
      properties:
        themeId:
          type: string
          pattern: ^[a-z_]{1,20}$
        name:
          type: string
          minLength: 1
          maxLength: 20
    Timestamp:
      type: string
      format: date-time
      description: UTC(C-8)
    SessionRequest:
      type: object
      required:
      - authCode
      additionalProperties: false
      properties:
        authCode:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^[\x21-\x7E]+$
          description: User.createAnonymousKeyAuthCode()의 code. 300초 안에 한 번만
    Session:
      type: object
      required:
      - sessionToken
      - expiresAt
      additionalProperties: false
      properties:
        sessionToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 'Authorization: Bearer로 보내는 토큰. 기기 밖에 남기지 않음'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    ThemeList:
      type: object
      required:
      - themes
      additionalProperties: false
      properties:
        themes:
          type: array
          maxItems: 20
          items:
            type: object
            required:
            - themeId
            - name
            - questionSetVersion
            additionalProperties: false
            properties:
              themeId:
                type: string
                pattern: ^[a-z_]{1,20}$
              name:
                type: string
                minLength: 1
                maxLength: 20
              questionSetVersion:
                type: integer
                minimum: 1
    NewRoom:
      type: object
      required:
      - themeId
      - gatheringName
      - partySize
      - hostNickname
      additionalProperties: false
      properties:
        themeId:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[a-z_]{1,20}$
          description: themes.id(TBL-003)
        gatheringName:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[^\x00-\x1F\x7F]+$
          description: rooms.gathering_name. 앞뒤 공백을 지운 뒤 1~20자
        partySize:
          type: integer
          minimum: 2
          maximum: 8
          description: rooms.party_size
        hostNickname:
          type: string
          minLength: 1
          maxLength: 10
          pattern: ^[^\x00-\x1F\x7F]+$
          description: participants.nickname. 앞뒤 공백을 지운 뒤 1~10자, 금칙어 없음(SPEC-008)
    CreatedRoom:
      type: object
      required:
      - roomCode
      - gatheringName
      - partySize
      - theme
      additionalProperties: false
      properties:
        roomCode:
          $ref: '#/components/schemas/RoomCodeValue'
        gatheringName:
          type: string
          minLength: 1
          maxLength: 20
        partySize:
          type: integer
          minimum: 2
          maximum: 8
        theme:
          $ref: '#/components/schemas/ThemeRef'
    RoomView:
      type: object
      required:
      - roomCode
      - gatheringName
      - theme
      - partySize
      - submittedCount
      - isFull
      - status
      - myRole
      - mySubmitted
      - asOf
      additionalProperties: false
      properties:
        roomCode:
          $ref: '#/components/schemas/RoomCodeValue'
        gatheringName:
          type: string
          minLength: 1
          maxLength: 20
        theme:
          $ref: '#/components/schemas/ThemeRef'
        partySize:
          type: integer
          minimum: 2
          maximum: 8
        submittedCount:
          type: integer
          minimum: 0
          maximum: 8
          description: 응답 완료 수(TERM-013)
        isFull:
          type: boolean
          description: 열린 방에 참여자가 8명인지
        status:
          type: string
          enum:
          - open
          - closed
        myRole:
          type: string
          enum:
          - none
          - member
          - host
        mySubmitted:
          type: boolean
        asOf:
          $ref: '#/components/schemas/Timestamp'
    JoinRequest:
      type: object
      required:
      - nickname
      additionalProperties: false
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 10
          pattern: ^[^\x00-\x1F\x7F]+$
          description: participants.nickname(SPEC-008)
    JoinResult:
      type: object
      required:
      - roomCode
      - myRole
      - mySubmitted
      additionalProperties: false
      properties:
        roomCode:
          $ref: '#/components/schemas/RoomCodeValue'
        myRole:
          type: string
          enum:
          - member
          - host
        mySubmitted:
          type: boolean
    QuestionView:
      type: object
      required:
      - questionSetVersion
      - questions
      additionalProperties: false
      properties:
        questionSetVersion:
          type: integer
          minimum: 1
        questions:
          type: array
          minItems: 8
          maxItems: 8
          items:
            type: object
            required:
            - position
            - prompt
            - optionA
            - optionB
            additionalProperties: false
            properties:
              position:
                type: integer
                minimum: 1
                maximum: 8
              prompt:
                type: string
                minLength: 1
                maxLength: 40
              optionA:
                type: string
                minLength: 1
                maxLength: 30
              optionB:
                type: string
                minLength: 1
                maxLength: 30
    ResponseSubmission:
      type: object
      required:
      - answers
      additionalProperties: false
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 8
          description: 8개여야 저장돼요. 1~7개면 400 wrong_count와 남은 문항(positions)
          items:
            type: object
            required:
            - position
            - choice
            additionalProperties: false
            properties:
              position:
                type: integer
                minimum: 1
                maximum: 8
              choice:
                type: string
                enum:
                - A
                - B
                - none
                description: none = 상관없어요(TERM-011). 저장할 때 N
    PersonalProfile:
      type: object
      required:
      - summary
      - axes
      additionalProperties: false
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 60
          description: 한 줄 설명. 점수·유형 이름 없음
        axes:
          type: array
          maxItems: 3
          items:
            type: object
            required:
            - axis
            - band
            additionalProperties: false
            properties:
              axis:
                type: string
                enum:
                - plan_speed
                - spending_priority
                - schedule_change
              band:
                type: string
                enum:
                - low
                - balanced
                - high
    SubmitResult:
      type: object
      required:
      - roomStatus
      - submittedCount
      - partySize
      - cardStage
      - logConversion
      - profile
      additionalProperties: false
      properties:
        roomStatus:
          type: string
          enum:
          - open
          - closed
        submittedCount:
          type: integer
          minimum: 1
          maximum: 8
        partySize:
          type: integer
          minimum: 2
          maximum: 8
        cardStage:
          type: string
          enum:
          - none
          - interim
          - final
        logConversion:
          type: boolean
          description: true면 화면이 대표 전환 이벤트를 한 번 기록(SPEC-018). 방마다 한 번만 true
        profile:
          $ref: '#/components/schemas/PersonalProfile'
    CardItem:
      type: object
      required:
      - position
      - prompt
      - optionA
      - optionB
      - category
      - countA
      - countB
      - countNone
      - text
      additionalProperties: false
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 8
        prompt:
          type: string
          minLength: 1
          maxLength: 40
        optionA:
          type: string
          minLength: 1
          maxLength: 30
        optionB:
          type: string
          minLength: 1
          maxLength: 30
        category:
          type: string
          enum:
          - agreed
          - split
          - open
          description: agreed 모두 좋아요, split 조율해요, open 누구나 괜찮아요
        countA:
          type: integer
          minimum: 0
          maximum: 8
        countB:
          type: integer
          minimum: 0
          maximum: 8
        countNone:
          type: integer
          minimum: 0
          maximum: 8
        text:
          type: string
          minLength: 1
          maxLength: 60
          description: agreed는 확정 문구, split은 조율 제안 문구, open은 고정 문구
    Card:
      type: object
      required:
      - stage
      - basedOnCount
      - partySize
      - items
      - nextAction
      - finalizedAt
      - asOf
      additionalProperties: false
      properties:
        stage:
          type: string
          enum:
          - none
          - interim
          - final
          description: none = 응답 완료 2명 미만이거나 카드 없이 마감
        basedOnCount:
          type: integer
          minimum: 0
          maximum: 8
        partySize:
          type: integer
          minimum: 2
          maximum: 8
        items:
          type: array
          maxItems: 8
          description: stage none이면 빈 목록, 그 밖에는 8개
          items:
            $ref: '#/components/schemas/CardItem'
        nextAction:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 60
        finalizedAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        asOf:
          $ref: '#/components/schemas/Timestamp'
    CloseResult:
      type: object
      required:
      - roomStatus
      - closeReason
      - card
      additionalProperties: false
      properties:
        roomStatus:
          type: string
          enum:
          - closed
        closeReason:
          type: string
          enum:
          - all_submitted
          - host_closed
          - host_deleted
        card:
          $ref: '#/components/schemas/Card'
    SubscriptionRequest:
      type: object
      required:
      - authCode
      additionalProperties: false
      properties:
        authCode:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^[\x21-\x7E]+$
    SubscriptionResult:
      type: object
      required:
      - subscribed
      additionalProperties: false
      properties:
        subscribed:
          type: boolean
          enum:
          - true
    MyRoomList:
      type: object
      required:
      - rooms
      - asOf
      additionalProperties: false
      properties:
        rooms:
          type: array
          maxItems: 20
          items:
            type: object
            required:
            - roomCode
            - gatheringName
            - theme
            - partySize
            - submittedCount
            - myRole
            - mySubmitted
            additionalProperties: false
            properties:
              roomCode:
                $ref: '#/components/schemas/RoomCodeValue'
              gatheringName:
                type: string
                minLength: 1
                maxLength: 20
              theme:
                $ref: '#/components/schemas/ThemeRef'
              partySize:
                type: integer
                minimum: 2
                maximum: 8
              submittedCount:
                type: integer
                minimum: 0
                maximum: 8
              myRole:
                type: string
                enum:
                - member
                - host
              mySubmitted:
                type: boolean
        asOf:
          $ref: '#/components/schemas/Timestamp'
    PastCardPage:
      type: object
      required:
      - pastCards
      - nextCursor
      additionalProperties: false
      properties:
        pastCards:
          type: array
          maxItems: 20
          items:
            type: object
            required:
            - pastCardId
            - gatheringName
            - themeName
            - basedOnCount
            - items
            - nextAction
            - finalizedAt
            additionalProperties: false
            properties:
              pastCardId:
                type: integer
                minimum: 1
              gatheringName:
                type: string
                minLength: 1
                maxLength: 20
              themeName:
                type: string
                minLength: 1
                maxLength: 20
              basedOnCount:
                type: integer
                minimum: 2
                maximum: 8
              items:
                type: array
                minItems: 8
                maxItems: 8
                items:
                  $ref: '#/components/schemas/CardItem'
              nextAction:
                type: string
                minLength: 1
                maxLength: 60
              finalizedAt:
                $ref: '#/components/schemas/Timestamp'
        nextCursor:
          type:
          - string
          - 'null'
          maxLength: 64
    DataSummary:
      type: object
      additionalProperties: false
      required:
      - responseCount
      - nicknameCount
      - notificationSubscriptionCount
      - pastCardCount
      - openHostedRoomCount
      - retainedFinalCardCount
      properties:
        responseCount:
          type: integer
          minimum: 0
          description: 지워지는 응답 수
        nicknameCount:
          type: integer
          minimum: 0
          description: 지워지는 닉네임(참여자 행) 수
        notificationSubscriptionCount:
          type: integer
          minimum: 0
          description: 지워지는 알림 신청 수
        pastCardCount:
          type: integer
          minimum: 0
          description: 지워지는 지난 카드 수
        openHostedRoomCount:
          type: integer
          minimum: 0
          description: 지우면 마감되는, 내가 방장인 열린 방 수
        retainedFinalCardCount:
          type: integer
          minimum: 0
          description: '남는 것: 내 응답이 들어간 확정된 최종 카드 수(이름 없는 수)'
    EntryRecord:
      type: object
      required:
      - referrerKind
      additionalProperties: false
      properties:
        referrerKind:
          type: string
          enum:
          - external_share
          - other
          description: referrer가 external_share면 external_share, 없거나 다르면 other
  x-corthex:
    errors:
      invalid_request:
        status: 400
        meaning: 요청 형식이 틀렸어요(JSON이 아님, 요청 ID 헤더가 없거나 형식이 틀림)
        message: 요청을 처리하지 못했어요. 다시 해 주세요
        client: 앱 버그로 기록하고 [다시 시도]를 보여요
      validation_failed:
        status: 400
        meaning: 입력 값이 한계 밖이에요. errors에 칸과 이유가 있어요
        message: 칸 옆의 안내를 확인해 주세요
        client: 적은 값을 지우지 않고 칸마다 이유를 보여요
      auth_code_invalid:
        status: 400
        meaning: 알림 신청 때 보낸 인증 코드가 만료·재사용·위조됐어요(토스 4011)
        message: 알림을 신청하지 못했어요
        client: 새 인증 코드를 받아 한 번 다시 보내요
      unauthenticated:
        status: 401
        meaning: 세션 토큰이 없거나 끝났거나 무효예요(C-1)
        message: 다시 확인이 필요해요
        client: FL-001의 확인 단계로 돌아가 API-001을 다시 불러요
      auth_failed:
        status: 401
        meaning: '인증 코드를 확인하지 못했어요: 만료·재사용·위조, 토스 API 오류·시간 초과(SPEC-002)'
        message: 확인하지 못했어요
        client: '[다시 시도]·[닫기]를 보여요. 다시 시도는 새 인증 코드로 해요'
      origin_not_allowed:
        status: 403
        meaning: 허용된 두 Origin 밖의 요청이에요(SPEC-038)
        message: 지금은 쓸 수 없어요
        client: 보여 줄 화면이 없어요(토스 앱 밖 요청)
      not_participant:
        status: 403
        meaning: 이 방의 참여자가 아니에요
        message: 이 방에 먼저 들어와 주세요
        client: 방 소개(SPEC-006)로 보내요
      response_required:
        status: 403
        meaning: 열린 방에서 내 응답을 내기 전이에요(SPEC-019, SPEC-024)
        message: 답하면 볼 수 있어요
        client: 문항 화면(SPEC-010)으로 보내요
      not_host:
        status: 403
        meaning: 방장이 아니에요(SPEC-016)
        message: 방장만 마감할 수 있어요
        client: 마감 버튼을 감춰요
      identity_mismatch:
        status: 403
        meaning: 알림 신청 때 교환한 식별키가 세션의 사용자와 달라요
        message: 알림을 신청하지 못했어요
        client: API-001로 다시 확인한 뒤 신청을 다시 해요
      room_not_found:
        status: 404
        meaning: 없는 방, 형식이 틀린 방 코드, 만료로 지워진 방이에요(C-5)
        message: 이 방은 없거나 보관 기간이 지났어요
        client: '[방 만들기]를 보여요'
      route_not_found:
        status: 404
        meaning: 없는 경로예요(라우터 기본값을 이 모양으로 바꿈)
        message: 요청을 처리하지 못했어요
        client: 앱 버그로 기록해요
      method_not_allowed:
        status: 405
        meaning: 그 경로에 없는 메서드예요(Allow 헤더를 유지)
        message: 요청을 처리하지 못했어요
        client: 앱 버그로 기록해요
      room_closed:
        status: 409
        meaning: 방이 마감됐어요(입장·응답·알림 신청 거절)
        message: 방이 그사이 마감됐어요
        client: 최종 카드 읽기 전용 화면(SPEC-021)으로 보내요
      room_full:
        status: 409
        meaning: 열린 방에 참여자가 8명이에요
        message: 이 방은 8명이 다 찼어요
        client: 입장 버튼을 막고 [방 만들기]를 보여요
      already_submitted:
        status: 409
        meaning: 이미 응답을 냈어요. 저장된 응답은 그대로예요(SPEC-011)
        message: 이미 답했어요
        client: API-008로 내 결과를 불러와 보여요
      not_enough_responses:
        status: 409
        meaning: 응답 완료가 2명 미만이라 마감할 수 없어요(SPEC-016)
        message: 2명 이상이 답해야 마감할 수 있어요
        client: 방은 열린 그대로 두고 안내를 보여요
      theme_unavailable:
        status: 409
        meaning: 고른 테마에 배포된 문항 세트가 없어요(배포가 내려감, 없는 테마)
        message: 이 테마는 지금 쓸 수 없어요
        client: 테마 목록(API-002)을 다시 불러와요
      idempotency_conflict:
        status: 409
        meaning: 같은 요청 ID를 다른 내용으로 보냈어요(DEC-021)
        message: 요청을 처리하지 못했어요. 다시 해 주세요
        client: 새 요청 ID로 다시 보내요
      rate_limited:
        status: 429
        meaning: 요청 한도를 넘었어요(C-6, 토스 4095 포함). 바뀐 것이 없어요
        message: 잠시 뒤 다시 해 주세요
        client: Retry-After 초 뒤에 [다시 시도]를 켜요
      internal:
        status: 500
        meaning: 서버의 예상하지 못한 오류예요. 바뀐 것이 없어요(D1 batch 되돌림)
        message: 잠시 뒤 다시 해 주세요
        client: 적은 값을 지우지 않고 [다시 시도]와 traceId를 보여요
      toss_unavailable:
        status: 503
        meaning: 토스 파트너 API 오류·시간 초과(5초)예요(SPEC-024)
        message: 알림을 신청하지 못했어요
        client: '[다시 시도]를 보여요. 신청은 생기지 않았어요'
    jobs:
      expire-rooms:
