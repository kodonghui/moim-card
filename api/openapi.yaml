# moim-card 06 API 계약 (OpenAPI 3.1). 이 파일이 원본이에요: 계약을 먼저 고치고 코드를 고쳐요.
# 출처: docs/04-functional-spec/spec.md (SPEC), db/schema.sql (TBL). 검사: python3 scripts/check-contract.py
openapi: 3.1.0
info:
  title: moim-card API
  version: 0.1.0
  summary: 모임 합의 카드(가칭) 미니앱의 서버 계약 (06 API, 체크포인트 전 초안)
  description: |-
    Cloudflare Workers + D1 서버가 앱인토스 WebView(SDK 3.x) 화면에 주는 계약이에요. 계약이 먼저이고 코드는 이 파일을 따라요.

    - 출처: 04 기능 명세 SPEC-001~039, 05 ERD TBL-001~015(db/schema.sql). 각 operation의 `x-corthex`에 API ID·SPEC·TBL이 있어요.
    - 인증: API-001로 받은 세션 토큰을 `Authorization: Bearer`로 보내요(DEC-017).
    - Origin: 허용된 두 Origin(`https://<appName>.apps.tossmini.com`, `https://<appName>.private-apps.tossmini.com`)만 받아요. `Origin` 헤더가 없거나 다르면 403 origin_not_allowed예요(SPEC-038). 계약 테스트도 허용된 Origin 헤더를 붙여요.
    - 같은 요청 두 번(C-3): 상태를 바꾸는 6개 operation은 `Idempotency-Key`(UUID)가 필수예요. 같은 사용자·같은 키면 24시간 동안 첫 결과를 다시 돌려줘요.
    - 입력 오류는 모두 400이에요(422를 쓰지 않음). 모든 오류는 `application/problem+json`의 Problem 모양이고 code는 `components.x-corthex.errors`에 있는 것만 써요.
    - 서버 안 작업(HTTP operation 아님): 방 만료 Cron(SPEC-030, 매시간), 알림 발송(SPEC-025, API-007 커밋 뒤), 알림 신청 정리(SPEC-026, 마감·만료·지우기 batch 안), 요청 ID·한도 계수·만료 세션 정리. `x-corthex.jobs`에 있어요.
servers:
- url: http://127.0.0.1:8787
  description: wrangler dev(로컬). 스테이징·실서비스 주소는 11 개발 단계에서 정해요
security:
- bearerAuth: []
tags:
- name: moim-card
paths:
  /v1/sessions:
    post:
      operationId: createSession
      summary: 인증 코드를 교환해 세션 시작
      description: 화면이 `User.createAnonymousKeyAuthCode()`로 받은 일회용 인증 코드를 보내요. 서버는 토스 파트너 API `POST /api-partner/v1/apps-in-toss/users/anon-key/exchange`(mTLS)로 교환해 `anonKey`를 받고, HMAC 해시로 사용자를 찾거나 만들어요(TBL-001).
        세션 토큰(무작위 256비트, base64url 43자)을 새로 발급하고 D1에는 SHA-256 해시만 둬요(TBL-002, DEC-017). 토스 응답은 HTTP 200이어도 `resultType`이 `SUCCESS`가 아니면 실패로 다뤄요(F-6, DEC-020). 식별키는 응답·로그에 넣지 않아요(C-7).
      x-corthex:
        id: API-001
        spec:
        - SPEC-002
        - SPEC-003
        - SPEC-038
        tables:
        - TBL-001
        - TBL-002
        - TBL-014
        omit:
          '404': 경로가 자원을 가리키지 않아요
          '409': 교환할 때마다 새 세션이 생겨 기존 상태와 부딪히지 않아요
        cases:
          access: 세션 없이 부름(인증 코드가 확인 수단), Origin 확인
          repeats: 같은 코드는 두 번 쓰이지 않아 두 번째는 401
          outside: 토스 오류·시간 초과는 401 auth_failed(SPEC-002가 확인 실패로 묶음)
          exposure: 식별키·해시·사용자 ID를 넣지 않음
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
            examples:
              code:
                summary: SDK가 준 인증 코드
                value:
                  authCode: a1b2c3d4e5f60718293a4b5c6d7e8f90
      responses:
        '201':
          description: 세션 시작. 처음 온 사용자면 사용자 행 1개가 생김
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                started:
                  summary: 세션 토큰 발급
                  value:
                    sessionToken: q8Xk2v0mZtR5bN1cY7wLp3sH9dF4gJ6aE2uC0oI8kT1
                    expiresAt: '2026-11-28T21:30:00Z'
        '400':
          description: 인증 코드가 없거나 형식이 틀림
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                auth-code-missing:
                  summary: authCode가 없음
                  value:
                    type: about:blank
                    title: 칸 옆의 안내를 확인해 주세요
                    status: 400
                    code: validation_failed
                    traceId: 14c7a7db483d4135
                    errors:
                    - field: authCode
                      reason: required
                not-json:
                  $ref: '#/components/examples/not-json'
        '401':
          description: 인증 코드를 확인하지 못함(만료·재사용·위조, 토스 오류·시간 초과). D1에 쓴 행은 0개
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                code-reused:
                  summary: 이미 교환한 코드(토스 4011)
                  value:
                    type: about:blank
                    title: 확인하지 못했어요
                    status: 401
                    code: auth_failed
                    traceId: e1b9626031725d4d
                toss-timeout:
                  summary: 토스 API가 5초 안에 답하지 않음
                  value:
                    type: about:blank
                    title: 확인하지 못했어요
                    status: 401
                    code: auth_failed
                    traceId: e913d02127fcade1
        '403':
          description: 이 호출자는 할 수 없음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                origin-not-allowed:
                  $ref: '#/components/examples/origin-not-allowed'
        '429':
          description: 토스 API 한도(미니앱당 분당 3,000건, 토스 4095)를 넘어 교환하지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                toss-app-limit:
                  summary: 미니앱 전체 토스 API 한도 초과
                  value:
                    type: about:blank
                    title: 잠시 뒤 다시 해 주세요
                    status: 429
                    code: rate_limited
                    traceId: c036bd3f305d4faa
          headers:
            Retry-After:
              description: 다시 보내도 되는 때까지 남은 초
              schema:
                type: integer
                minimum: 1
                maximum: 86400
              example: 30
        default:
          description: 그 밖의 오류(500 internal, 라우터의 404 route_not_found·405 method_not_allowed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                server-error:
                  $ref: '#/components/examples/server-error'
                method-not-allowed:
                  $ref: '#/components/examples/method-not-allowed'
  /v1/themes:
    get:
      operationId: listThemes
      summary: 테마 목록
      description: 배포된 테마와 각 테마의 최신 문항 세트 버전(status = published 중 가장 큰 version)을 sort_order 순으로 돌려줘요(TERM-036). 0개면 빈 목록이에요.
      x-corthex:
        id: API-002
        spec:
        - SPEC-004
        tables:
        - TBL-003
        - TBL-004
        omit:
          '400': 입력이 없어요
          '404': 경로가 자원을 가리키지 않아요
          '409': 읽기만 해요
          '429': 읽기 요청은 C-6 한도에 세지 않아요
        cases:
          empty: '배포된 테마 0개면 themes: []'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 테마 목록. 비어 있을 수 있음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeList'
              examples:
                three-themes:
                  summary: 배포된 테마 3개
                  value:
                    themes:
                    - themeId: travel
                      name: 여행
                      questionSetVersion: 1
                    - themeId: dinner
                      name: 회식·저녁
                      questionSetVersion: 2
                    - themeId: weekend
                      name: 주말 나들이
                      questionSetVersion: 1
                empty:
                  summary: 배포된 테마 0개
                  value:
                    themes: []
        '401':
          description: 세션 토큰이 없거나 끝남(C-1). 아무것도 읽거나 쓰지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no-session:
                  $ref: '#/components/examples/no-session'
                session-expired:
                  $ref: '#/components/examples/session-expired'
        '403':
          description: 이 호출자는 할 수 없음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                origin-not-allowed:
                  $ref: '#/components/examples/origin-not-allowed'
        default:
          description: 그 밖의 오류(500 internal, 라우터의 404 route_not_found·405 method_not_allowed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                server-error:
                  $ref: '#/components/examples/server-error'
                method-not-allowed:
                  $ref: '#/components/examples/method-not-allowed'
  /v1/rooms:
    post:
      operationId: createRoom
      summary: 방 만들기
      description: 그 테마의 배포된 최신 문항 세트 버전을 고정한 방을 만들고 방 코드(C-5)를 발급해요. 방장을 첫 참여자로 등록해요. 한 D1 batch예요. 모임 이름·닉네임은 앞뒤 공백을 지운 뒤 길이를 다시 봐요(공백만이면 빈 값). 보낸 값 자체도 maxLength를 넘으면 받지 않아요.
      x-corthex:
        id: API-003
        spec:
        - SPEC-005
        - SPEC-008
        tables:
        - TBL-003
        - TBL-004
        - TBL-006
        - TBL-007
        - TBL-013
        - TBL-014
        omit:
          '404': 경로가 자원을 가리키지 않아요. 없는 테마는 409 theme_unavailable이에요
        cases:
          repeats: 같은 Idempotency-Key면 방은 하나이고 첫 응답(같은 방 코드)을 다시 돌려줌
          limits: 방 만들기 24시간 30개, 쓰기 분당 60건
          exposure: 방 코드·모임 이름·인원·테마만
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRoom'
            examples:
              jeju:
                summary: 제주 3박, 인원 4
                value:
                  themeId: travel
                  gatheringName: 제주 3박
                  partySize: 4
                  hostNickname: 민지
      responses:
        '201':
          description: 방이 생김
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedRoom'
              examples:
                created:
                  summary: 여행 v1, 인원 4
                  value:
                    roomCode: ABCDEFGH23
                    gatheringName: 제주 3박
                    partySize: 4
                    theme:
                      themeId: travel
                      name: 여행
        '400':
          description: 요청 형식이나 입력 값이 틀림. 아무것도 바뀌지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                party-size-out-of-range:
                  summary: 인원 9
                  value:
                    type: about:blank
                    title: 칸 옆의 안내를 확인해 주세요
                    status: 400
                    code: validation_failed
                    traceId: 24c5c3fa11bdc958
                    errors:
                    - field: partySize
                      reason: out_of_range
                name-blank-and-nickname-banned:
                  summary: 모임 이름이 공백뿐이고 닉네임에 금칙어
                  value:
                    type: about:blank
                    title: 칸 옆의 안내를 확인해 주세요
                    status: 400
                    code: validation_failed
                    traceId: 611db07b4a436310
                    errors:
                    - field: gatheringName
                      reason: required
                    - field: hostNickname
                      reason: banned_word
                missing-idempotency-key:
                  $ref: '#/components/examples/missing-idempotency-key'
                not-json:
                  $ref: '#/components/examples/not-json'
        '401':
          description: 세션 토큰이 없거나 끝남(C-1). 아무것도 읽거나 쓰지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no-session:
                  $ref: '#/components/examples/no-session'
                session-expired:
                  $ref: '#/components/examples/session-expired'
        '403':
          description: 이 호출자는 할 수 없음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                origin-not-allowed:
                  $ref: '#/components/examples/origin-not-allowed'
        '409':
          description: 만들 수 없는 상태
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                theme-unavailable:
                  summary: 고른 테마의 배포가 내려감
                  value:
                    type: about:blank
                    title: 이 테마는 지금 쓸 수 없어요
                    status: 409
                    code: theme_unavailable
                    traceId: 099bc07094c52e09
                idempotency-conflict:
                  $ref: '#/components/examples/idempotency-conflict'
        '429':
          description: 한도를 넘어 방을 만들지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                room-create-limit:
                  summary: 방 만들기 사용자당 24시간 30개 초과
                  value:
                    type: about:blank
                    title: 잠시 뒤 다시 해 주세요
                    status: 429
                    code: rate_limited
                    traceId: 7e360da120b6e534
                write-limit:
                  $ref: '#/components/examples/write-limit'
          headers:
            Retry-After:
              description: 다시 보내도 되는 때까지 남은 초
              schema:
                type: integer
                minimum: 1
                maximum: 86400
              example: 30
        default:
          description: 그 밖의 오류(500 internal, 라우터의 404 route_not_found·405 method_not_allowed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                server-error:
                  $ref: '#/components/examples/server-error'
                method-not-allowed:
                  $ref: '#/components/examples/method-not-allowed'
  /v1/rooms/{roomCode}:
    get:
      operationId: getRoom
      summary: 방 소개와 내 참여 상태
      description: '방 코드로 방을 찾아 방 소개(TERM-037)와 내 역할·응답 여부를 돌려줘요. 화면은 이 값으로 나눠요: 열린 방·참여자 아님 → 방 소개, 참여자 → 문항 화면이나 내 결과, 마감 → 최종 카드 읽기 전용(API-009). 방장에게는 같은 값으로 응답 현황("인원 n명 중 m명", SPEC-017)을 보여요. 닉네임과
        누가 답했는지는 넣지 않아요.'
      x-corthex:
        id: API-004
        spec:
        - SPEC-006
        - SPEC-017
        - SPEC-021
        - SPEC-039
        tables:
        - TBL-006
        - TBL-007
        - TBL-008
        omit:
          '400': 형식이 틀린 방 코드도 404로 답해요(C-5, DEC-021)
          '409': 읽기만 해요
          '429': 읽기 요청은 C-6 한도에 세지 않아요
        cases:
          target: 없는·형식이 틀린·만료된 코드는 같은 404
          exposure: 닉네임·누가 답했는지 없음, 참여자 수 대신 isFull
          screens: status·myRole·mySubmitted로 화면을 나눔
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RoomCode'
      responses:
        '200':
          description: 방이 있음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomView'
              examples:
                open-newcomer:
                  summary: 열린 방, 참여자 아님
                  value:
                    roomCode: ABCDEFGH23
                    gatheringName: 제주 3박
                    theme:
                      themeId: travel
                      name: 여행
                    partySize: 4
                    submittedCount: 2
                    isFull: false
                    status: open
                    myRole: none
                    mySubmitted: false
                    asOf: '2026-11-28T09:30:00Z'
                open-host:
                  summary: 방장이 보는 응답 현황
                  value:
                    roomCode: ABCDEFGH23
                    gatheringName: 제주 3박
                    theme:
                      themeId: travel
                      name: 여행
                    partySize: 4
                    submittedCount: 3
                    isFull: false
                    status: open
                    myRole: host
                    mySubmitted: true
                    asOf: '2026-11-28T09:30:00Z'
                open-full:
                  summary: 8명이 찬 열린 방
                  value:
                    roomCode: ABCDEFGH23
                    gatheringName: 제주 3박
                    theme:
                      themeId: travel
                      name: 여행
                    partySize: 8
                    submittedCount: 5
                    isFull: true
                    status: open
                    myRole: none
                    mySubmitted: false
                    asOf: '2026-11-28T09:30:00Z'
                closed:
                  summary: 마감된 방
                  value:
                    roomCode: ABCDEFGH23
                    gatheringName: 제주 3박
                    theme:
                      themeId: travel
                      name: 여행
                    partySize: 4
                    submittedCount: 4
                    isFull: false
                    status: closed
                    myRole: none
                    mySubmitted: false
                    asOf: '2026-11-28T09:30:00Z'
        '401':
          description: 세션 토큰이 없거나 끝남(C-1). 아무것도 읽거나 쓰지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no-session:
                  $ref: '#/components/examples/no-session'
                session-expired:
                  $ref: '#/components/examples/session-expired'
        '403':
          description: 이 호출자는 할 수 없음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                origin-not-allowed:
                  $ref: '#/components/examples/origin-not-allowed'
        '404':
          description: 방이 없음. 형식이 틀린 코드·만료로 지워진 방도 같은 응답(C-5)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                room-not-found:
                  $ref: '#/components/examples/room-not-found'
                room-code-wrong-format:
                  $ref: '#/components/examples/room-code-wrong-format'
                room-expired:
                  $ref: '#/components/examples/room-expired'
        default:
          description: 그 밖의 오류(500 internal, 라우터의 404 route_not_found·405 method_not_allowed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                server-error:
                  $ref: '#/components/examples/server-error'
                method-not-allowed:
                  $ref: '#/components/examples/method-not-allowed'
  /v1/rooms/{roomCode}/participants:
    post:
      operationId: joinRoom
      summary: 방 입장
