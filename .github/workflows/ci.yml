name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: python3 -m pip install -r requirements-checks.txt
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @moim-card/apps-web exec playwright install --with-deps chromium
      - run: pnpm --filter @moim-card/apps-web test:browser
      - run: python3 scripts/check-tokens.py
      - run: node scripts/check-client-logs.cjs
      - run: python3 -m unittest discover -s scripts -p test_check_client_logs.py
      - run: python3 -m unittest discover -s scripts -p test_check_build.py
      - run: python3 scripts/check-build.py
      - run: python3 -m unittest discover -s scripts -p test_check_question_sets.py
      - run: python3 -m unittest discover -s scripts -p test_publish_question_set.py
      - run: python3 -m unittest discover -s scripts -p test_first_question_sets.py
      - run: python3 scripts/check-question-sets.py
      - run: python3 scripts/check-contract.py
      - run: python3 scripts/check-screens.py
      - run: python3 scripts/check-wbs.py
      - run: git check-ignore -q .env
