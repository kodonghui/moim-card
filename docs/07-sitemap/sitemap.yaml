# 모임 합의 카드(가칭) 사이트맵 (07)
# 원본: 이 파일(truth: source). 보기(board, list, slides)는 scripts/draw-screens.py가 이 파일에서 그려요.
# 경로는 미니앱 안 화면 경로예요. 방 코드는 경로에 넣지 않고 메모리에만 둬요(S-1).
# 초대 링크 intoss://…?room=<방 코드>로 열리면 SCR-001이 방 코드를 읽고 주소에서 지운 뒤 SCR-005로 가요.
# 토스가 그리는 화면(공유 시트, 알림 동의문, 내비게이션 바)과 서버·운영 흐름(FL-005, FL-013, FL-014)은 SCR이 없어요.
# without a screen: TERM-008, TERM-040
# 위 두 용어(문항 세트, 점검 목록)는 운영자가 저장소 스크립트로 다뤄요(FL-014, SPEC-031·032). 미니앱 화면이 아니에요.
- id: SCR-001
  name: 진입 확인
  path: /
  access: 토스 앱 사용자 누구나(확인 전)
  status: active
  flows: [FL-001, FL-003]
  terms: [CTX-004, TERM-028, TERM-029, TERM-034]
  children:
    - id: SCR-002
      name: 홈
      path: /home
      access: 확인된 사용자
      status: active
      flows: [FL-001, FL-002, FL-011, FL-012, FL-015, FL-016]
      terms: [CTX-001, TERM-046, TERM-002, TERM-031]
      children:
        - id: SCR-003
          name: 테마 고르기
          path: /rooms/new
          access: 확인된 사용자
          status: active
          flows: [FL-002, FL-009]
          terms: [CTX-001, TERM-036, TERM-007]
          children:
            - id: SCR-004
              name: 방 정보 적기
              path: /rooms/new/details
              access: 확인된 사용자(테마를 고른 뒤)
              status: active
              flows: [FL-002]
              terms: [CTX-001, TERM-002, TERM-043, TERM-006, TERM-030, TERM-004]
        - id: SCR-011
          name: 지난 카드
          path: /past-cards
          access: 확인된 사용자(자기 지난 카드만)
          status: active
          flows: [FL-011]
          terms: [CTX-001, TERM-044]
          children:
            - id: SCR-012
              name: 지난 카드 자세히
              path: /past-cards/:pastCardId
              access: 확인된 사용자(자기 지난 카드만)
              status: active
              flows: [FL-011]
              terms: [CTX-001, TERM-044, TERM-016]
        - id: SCR-013
          name: 내 데이터 지우기
          path: /me/delete
          access: 확인된 사용자(자기 데이터만)
          status: active
          flows: [FL-012]
          terms: [CTX-004, TERM-042, TERM-031]
        - id: SCR-014
          name: 이용약관
          path: /legal/terms
          access: 확인된 사용자
          status: active
          flows: [FL-015]
          terms: none
        - id: SCR-015
          name: 개인정보처리방침
          path: /legal/privacy
          access: 확인된 사용자
          status: active
          flows: [FL-015]
          terms: [CTX-004, TERM-027]
    - id: SCR-005
      name: 방 소개
      path: /room
      access: 방 코드를 가진 확인된 사용자(초대 링크 또는 내 방 목록)
      status: active
      flows: [FL-001, FL-003, FL-016]
      terms: [CTX-001, TERM-037, TERM-003]
      children:
        - id: SCR-006
          name: 닉네임 정하기
          path: /room/join
          access: 참여자가 아닌 확인된 사용자(열린 방, 8명 미만)
          status: active
          flows: [FL-003]
          terms: [CTX-001, TERM-030, TERM-005, TERM-045]
        - id: SCR-007
          name: 문항
          path: /room/questions
          access: 참여자(응답 전, 열린 방)
          status: active
          flows: [FL-002, FL-003, FL-004, FL-007]
          terms: [CTX-001, TERM-038, TERM-009, TERM-010, TERM-011, TERM-012]
        - id: SCR-008
          name: 내 결과
          path: /room/result
          access: 참여자(응답 뒤)
          status: active
          flows: [FL-003, FL-004, FL-007, FL-010]
          terms: [CTX-003, TERM-023, TERM-024, TERM-035, TERM-033]
        - id: SCR-009
          name: 합의 카드
          path: /room/card
          access: 참여자(응답 뒤, 열린 방). 마감하기는 방장만
          status: active
          flows: [FL-006, FL-007, FL-008]
          terms: [CTX-001, TERM-014, TERM-015, TERM-039, TERM-017, TERM-018, TERM-019, TERM-020, TERM-032]
        - id: SCR-010
          name: 최종 카드
          path: /room/final
          access: 마감된 방의 방 코드를 가진 확인된 사용자 누구나. 카드 저장·단톡방에 보내기는 응답한 참여자만
          status: active
          flows: [FL-002, FL-004, FL-006, FL-007, FL-008, FL-009]
          terms: [CTX-001, TERM-016, TERM-025]
